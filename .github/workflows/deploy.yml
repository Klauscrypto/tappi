name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 94.130.191.178
          username: root
          key: ${{ secrets.TAPPI_DEPLOY_KEY }}
          source: dist/*
          target: /opt/tappi/html
          strip_components: 1

      - name: Reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 94.130.191.178
          username: root
          key: ${{ secrets.TAPPI_DEPLOY_KEY }}
          script: |
            cd /opt/solarcalc
            docker compose up -d --force-recreate caddy
